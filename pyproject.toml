# Where: pyproject.toml
# What: build + metadata for the agent-policy package.
# Why: keep the dependency surface tiny — pydantic only, tomllib from stdlib.

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "yui-agent-policy"
version = "0.1.1"
description = "Pure-function policy matrix evaluator for AI coding agents (repo x capability x context -> deny/require_approval/auto_allow)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "yui-stingray" }]
keywords = ["agent", "policy", "guardrails", "governance", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-cov>=4",
]

[project.urls]
Repository = "https://github.com/yui-stingray/agent-policy"
Issues = "https://github.com/yui-stingray/agent-policy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
