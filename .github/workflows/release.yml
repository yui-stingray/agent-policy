# Where: .github/workflows/release.yml
# What: build sdist+wheel and publish to PyPI on tag push, via Trusted Publishing (OIDC).
# Why: remove the ~/.pypirc token dependency. Subsequent releases authenticate
#      through a short-lived OIDC token minted by GitHub, not a long-lived
#      account-scoped PyPI token.
#
# Notes:
# - `twine check` validates README/metadata integrity only. It does NOT catch
#   server-side policy violations (e.g. PyPI name-similarity rejection). Those
#   surface at upload time, which is acceptable once the project name is stable.
# - `id-token: write` is scoped to the publish job only. The build job has no
#   write permissions so a compromised dependency in `build` cannot mint tokens.

name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python scripts/check_release_version.py "$TAG_NAME"
      - name: Install build + twine
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Verify metadata (twine check)
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yui-agent-policy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
