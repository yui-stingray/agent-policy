# Where: .github/workflows/release.yml
# What: build sdist+wheel and publish to PyPI on tag push, via Trusted Publishing (OIDC).
# Why: remove the ~/.pypirc token dependency. Subsequent releases authenticate
#      through a short-lived OIDC token minted by GitHub, not a long-lived
#      account-scoped PyPI token.
#
# Notes:
# - `twine check` validates README/metadata integrity only. It does NOT catch
#   server-side policy violations (e.g. PyPI name-similarity rejection). Those
#   surface at upload time, which is acceptable once the project name is stable.
# - `id-token: write` is scoped to the publish job only. The build job has no
#   write permissions so a compromised dependency in `build` cannot mint tokens.

name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI instead of build-only dry run'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-release-request:
    name: validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual publish ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.publish }}" = "true" ] \
             && [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::manual publish=true must be run against a v* tag ref, not ${GITHUB_REF}"
            exit 1
          fi
          echo "release request accepted for ${GITHUB_REF}"

  build:
    name: build sdist + wheel
    needs: validate-release-request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assert tag matches package version
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python scripts/check_release_version.py "$TAG_NAME"
      - name: Check PyPI release state
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_pypi_release_state.py
      - name: Install build + twine
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Verify metadata (twine check)
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (OIDC)
    needs: build
    if: github.event_name == 'push' || (inputs.publish && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yui-agent-policy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
