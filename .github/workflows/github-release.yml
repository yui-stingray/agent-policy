# Where: .github/workflows/github-release.yml
# What: create or update a GitHub Release from CHANGELOG.md after PyPI release succeeds.
# Why: keep GitHub release notes decoupled from PyPI upload so immutable PyPI
#      versions do not make release-note retries unsafe.

name: github-release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.1.4'
        required: true
        type: string
  workflow_run:
    workflows: ['release']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-github-release:
    name: publish GitHub release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::manual release tag must match vX.Y.Z"
              exit 1
            fi
            tag="$INPUT_TAG"
          else
            tag="$(jq -r '.workflow_run.head_branch' "${GITHUB_EVENT_PATH}")"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::notice::release workflow_run was not for a version tag"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          tag_sha="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}")" || {
            echo "::error::verified release tag was not found"
            exit 1
          }
          {
            echo "publish=true"
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "sha=${tag_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release source run
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            if [ "$RELEASE_SHA" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
              echo "::error::release tag commit does not match completed release workflow commit"
              exit 1
            fi
            exit 0
          fi

          run_count="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release.yml \
              --branch "$RELEASE_TAG" \
              --commit "$RELEASE_SHA" \
              --event push \
              --status completed \
              --json conclusion \
              --jq '[.[] | select(.conclusion == "success")] | length'
          )"
          if [ "$run_count" -lt 1 ]; then
            echo "::error::manual retry requires a successful completed tag-push release.yml run for the verified tag commit"
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        if: steps.tag.outputs.publish == 'true'
        with:
          python-version: '3.12'

      - name: Verify PyPI release is present
        if: steps.tag.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: python scripts/check_pypi_release_state.py --require-present "$RELEASE_VERSION"

      - name: Detach checkout to release commit
        if: steps.tag.outputs.publish == 'true'
        env:
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        run: git checkout --detach "$RELEASE_SHA"

      - name: Extract release notes
        if: steps.tag.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: python scripts/check_changelog.py --version "$RELEASE_VERSION" --write-notes release-notes.md

      - name: Create or update GitHub release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          remote_tag_ref="refs/release-check/verified-tag"
          git fetch --force --no-tags origin "refs/tags/${TAG_NAME}:${remote_tag_ref}"
          remote_tag_sha="$(git rev-parse "${remote_tag_ref}^{commit}")"
          if [ "$remote_tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error::release tag changed after verification"
            exit 1
          fi
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          else
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
