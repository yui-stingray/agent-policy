# Where: .github/workflows/github-release.yml
# What: create or verify a GitHub Release from CHANGELOG.md after PyPI release succeeds.
# Why: keep GitHub release notes decoupled from PyPI upload so immutable PyPI
#      versions do not make release-note retries unsafe.

name: github-release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.1.4'
        required: true
        type: string
      release_run_id:
        description: 'Optional exact completed tag-push release run ID; omit when unique'
        required: false
        type: string
        default: ''
  workflow_run:
    workflows: ['release']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish-github-release:
    name: publish GitHub release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require default branch for manual retry
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::manual GitHub Release retry must run from the default branch"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RUN_ID: ${{ inputs.release_run_id }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::manual release tag must match vX.Y.Z"
              exit 1
            fi
            if [ -n "$INPUT_RUN_ID" ] && [[ ! "$INPUT_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::manual recovery run ID must be a positive integer when provided"
              exit 1
            fi
            tag="$INPUT_TAG"
            release_run_id="$INPUT_RUN_ID"
          else
            if [ "$WORKFLOW_RUN_EVENT" != "push" ]; then
              echo "::error::automatic GitHub Release requires a tag-push release run"
              exit 1
            fi
            tag="$WORKFLOW_RUN_TAG"
            release_run_id="$WORKFLOW_RUN_ID"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::notice::release workflow_run was not for a version tag"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          source_tag_ref="refs/release-check/source-tag"
          if ! git fetch --force --no-tags origin \
            "refs/tags/${tag}:${source_tag_ref}" >/dev/null 2>&1; then
            echo "::error::release tag could not be fetched"
            exit 1
          fi
          tag_object_sha="$(git rev-parse -q --verify "$source_tag_ref" 2>/dev/null)" || {
            echo "::error::release tag object could not be resolved"
            exit 1
          }
          tag_object_type="$(git cat-file -t "$tag_object_sha" 2>/dev/null)" || {
            echo "::error::release tag object type could not be resolved"
            exit 1
          }
          if [ "$tag_object_type" != "tag" ] && [ "$tag_object_type" != "commit" ]; then
            echo "::error::release tag object type is unsupported"
            exit 1
          fi
          tag_sha="$(git rev-parse -q --verify "${source_tag_ref}^{commit}" 2>/dev/null)" || {
            echo "::error::release tag commit could not be resolved"
            exit 1
          }
          {
            echo "publish=true"
            echo "tag=${tag}"
            echo "version=${tag#v}"
            echo "sha=${tag_sha}"
            echo "tag_object_sha=${tag_object_sha}"
            echo "tag_object_type=${tag_object_type}"
            echo "run_id=${release_run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify successful automatic release source
        if: github.event_name == 'workflow_run' && steps.tag.outputs.publish == 'true'
        env:
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          TAG_OBJECT_TYPE: ${{ steps.tag.outputs.tag_object_type }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
            echo "::error::automatic GitHub Release requires an annotated release tag"
            exit 1
          fi
          if [ "$RELEASE_SHA" != "$WORKFLOW_RUN_HEAD_SHA" ]; then
            echo "::error::release tag commit does not match completed release workflow commit"
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        if: steps.tag.outputs.publish == 'true'
        with:
          python-version: '3.12'

      - name: Verify current automatic release topology
        if: github.event_name == 'workflow_run' && steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.tag.outputs.run_id }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          verification_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verification_dir"' EXIT
          run_json="${verification_dir}/run.json"
          jobs_json="${verification_dir}/jobs.json"
          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          if ! gh api "${api_headers[@]}" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" \
            >"$run_json" 2>/dev/null; then
            echo "::error::automatic release run metadata is unavailable"
            exit 1
          fi
          run_attempt="$(python scripts/verify_release_recovery.py run-attempt \
            --mode automatic \
            --run-json "$run_json" \
            --run-id "$RELEASE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA")"
          if [[ ! "$run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::automatic release run attempt is unavailable"
            exit 1
          fi
          if ! gh api --paginate --slurp "${api_headers[@]}" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/attempts/${run_attempt}/jobs?per_page=100" \
            >"$jobs_json" 2>/dev/null; then
            echo "::error::automatic release job metadata is unavailable"
            exit 1
          fi
          python scripts/verify_release_recovery.py validate-run \
            --mode automatic \
            --run-json "$run_json" \
            --jobs-json "$jobs_json" \
            --run-id "$RELEASE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION"

      - name: Resolve exact manual recovery run
        id: recovery
        if: github.event_name == 'workflow_dispatch' && steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          REQUESTED_RUN_ID: ${{ steps.tag.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_RUN_ID" ]; then
            run_id="$REQUESTED_RUN_ID"
          else
            selection_dir="$(mktemp -d)"
            trap 'rm -rf -- "$selection_dir"' EXIT
            candidates_json="${selection_dir}/candidate-runs.json"
            if ! gh api --method GET --paginate --slurp \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs" \
              -f head_sha="$RELEASE_SHA" \
              -f event=push \
              -f status=completed \
              -F per_page=100 >"$candidates_json" 2>/dev/null; then
              echo "::error::matching release run metadata is unavailable"
              exit 1
            fi
            run_id="$(python scripts/verify_release_recovery.py select-run \
              --runs-json "$candidates_json" \
              --repository "$GITHUB_REPOSITORY" \
              --tag "$RELEASE_TAG" \
              --sha "$RELEASE_SHA")"
          fi
          if [[ ! "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::exact release run could not be resolved"
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Verify exact manual recovery run and publication evidence
        id: recovery_evidence
        if: github.event_name == 'workflow_dispatch' && steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ steps.recovery.outputs.run_id }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          TAG_OBJECT_TYPE: ${{ steps.tag.outputs.tag_object_type }}
        run: |
          set -euo pipefail
          recovery_dir="$(mktemp -d)"
          trap 'rm -rf -- "$recovery_dir"' EXIT
          run_json="${recovery_dir}/run.json"
          run_after_json="${recovery_dir}/run-after.json"
          jobs_json="${recovery_dir}/jobs.json"
          artifacts_json="${recovery_dir}/artifacts.json"
          artifact_zip="${recovery_dir}/dist.zip"
          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          if ! gh api "${api_headers[@]}" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" \
            >"$run_json" 2>/dev/null; then
            echo "::error::release run metadata is unavailable"
            exit 1
          fi
          run_attempt="$(python scripts/verify_release_recovery.py run-attempt \
            --mode recovery \
            --run-json "$run_json" \
            --run-id "$RELEASE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA")"
          if [[ ! "$run_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::release run attempt is unavailable"
            exit 1
          fi
          if ! gh api --paginate --slurp "${api_headers[@]}" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/attempts/${run_attempt}/jobs?per_page=100" \
            >"$jobs_json" 2>/dev/null; then
            echo "::error::release job metadata is unavailable"
            exit 1
          fi
          if ! gh api --paginate --slurp "${api_headers[@]}" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/artifacts?per_page=100" \
            >"$artifacts_json" 2>/dev/null; then
            echo "::error::release artifact metadata is unavailable"
            exit 1
          fi
          recovery_result="$(python scripts/verify_release_recovery.py validate-run \
            --mode recovery \
            --run-json "$run_json" \
            --jobs-json "$jobs_json" \
            --artifacts-json "$artifacts_json" \
            --run-id "$RELEASE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION")"
          if [ "$recovery_result" = "historical-success" ]; then
            if [ "$TAG_OBJECT_TYPE" = "commit" ] && [ "$RELEASE_TAG" != "v0.1.6" ]; then
              echo "::error::lightweight tag recovery is not allowed for this release"
              exit 1
            fi
            echo "Successful historical release run verified"
            echo "kind=historical-success" >> "$GITHUB_OUTPUT"
          elif [ "$recovery_result" = "current-success" ]; then
            if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
              echo "::error::current release recovery requires an annotated tag"
              exit 1
            fi
            echo "Successful current release run verified"
            echo "kind=current-success" >> "$GITHUB_OUTPUT"
          elif [[ "$recovery_result" =~ ^[1-9][0-9]*$ ]]; then
            if [ "$TAG_OBJECT_TYPE" != "tag" ]; then
              echo "::error::failed current release recovery requires an annotated tag"
              exit 1
            fi
            artifact_id="$recovery_result"
            if ! gh api "${api_headers[@]}" \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              >"$artifact_zip" 2>/dev/null; then
              echo "::error::validated release artifact is unavailable"
              exit 1
            fi
            python scripts/verify_release_recovery.py verify-artifact \
              --artifact-zip "$artifact_zip" \
              --version "$RELEASE_VERSION"
            echo "kind=failed-current" >> "$GITHUB_OUTPUT"
          else
            echo "::error::manual recovery evidence is unavailable"
            exit 1
          fi
          if ! gh api "${api_headers[@]}" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" \
            >"$run_after_json" 2>/dev/null; then
            echo "::error::final release run metadata is unavailable"
            exit 1
          fi
          python scripts/verify_release_recovery.py verify-run-stable \
            --before-json "$run_json" \
            --after-json "$run_after_json" \
            --run-id "$RELEASE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA"

      - name: Verify exact PyPI release is present
        if: steps.tag.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..5}; do
            if python scripts/check_pypi_release_state.py --require-present "$RELEASE_VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "PyPI release-state check attempt ${attempt} failed; waiting for API propagation"
              sleep 10
            fi
          done
          echo "::error::PyPI release did not reach the expected exact file set"
          exit 1

      - name: Create or verify GitHub release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
          RECOVERY_KIND: ${{ steps.recovery_evidence.outputs.kind }}
          TAG_OBJECT_SHA: ${{ steps.tag.outputs.tag_object_sha }}
          TAG_OBJECT_TYPE: ${{ steps.tag.outputs.tag_object_type }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          publication_dir="$(mktemp -d)"
          trap 'rm -rf -- "$publication_dir"' EXIT
          releases_json="${publication_dir}/releases.json"
          remote_tag_ref="refs/release-check/verified-tag"
          if ! git fetch --force --no-tags origin \
            "refs/tags/${TAG_NAME}:${remote_tag_ref}" >/dev/null 2>&1; then
            echo "::error::release tag could not be re-fetched"
            exit 1
          fi
          remote_tag_object_sha="$(git rev-parse -q --verify "$remote_tag_ref" 2>/dev/null)" || {
            echo "::error::release tag object could not be re-resolved"
            exit 1
          }
          remote_tag_object_type="$(git cat-file -t "$remote_tag_object_sha" 2>/dev/null)" || {
            echo "::error::release tag object type could not be re-resolved"
            exit 1
          }
          remote_tag_sha="$(git rev-parse -q --verify "${remote_tag_ref}^{commit}" 2>/dev/null)" || {
            echo "::error::release tag commit could not be re-resolved"
            exit 1
          }
          if [ "$remote_tag_object_sha" != "$TAG_OBJECT_SHA" ] \
             || [ "$remote_tag_object_type" != "$TAG_OBJECT_TYPE" ] \
             || [ "$remote_tag_sha" != "$RELEASE_SHA" ]; then
            echo "::error::release tag object or commit changed after verification"
            exit 1
          fi

          if ! gh api --method GET --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/releases" \
            -F per_page=100 >"$releases_json" 2>/dev/null; then
            echo "::error::GitHub Release state is unavailable"
            exit 1
          fi
          release_state="$(python scripts/verify_release_recovery.py release-state \
            --releases-json "$releases_json" \
            --tag "$TAG_NAME")"
          if [ "$release_state" = "present" ]; then
            echo "GitHub Release is already clean and public for ${TAG_NAME}"
            exit 0
          fi
          if [ "$release_state" != "absent" ]; then
            echo "::error::GitHub Release state is ambiguous"
            exit 1
          fi
          if git show "${RELEASE_SHA}:CHANGELOG.md" > release-changelog.md 2>/dev/null; then
            python scripts/check_changelog.py \
              --changelog release-changelog.md \
              --version "$RELEASE_VERSION" \
              --write-notes release-notes.md
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
               && [ "$RECOVERY_KIND" = "historical-success" ]; then
            printf '%s\n' \
              "Historical release ${TAG_NAME}." \
              "" \
              "Recovered after verifying the matching successful tag-push release run and exact PyPI wheel/sdist. The tagged tree predates CHANGELOG.md." \
              > release-notes.md
          else
            echo "::error::release notes are unavailable from the verified commit"
            exit 1
          fi
          if ! gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --verify-tag >/dev/null 2>&1; then
            echo "::error::GitHub Release publication failed"
            exit 1
          fi
          echo "GitHub Release publication completed for ${TAG_NAME}"
